name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
      - name: Check PR Title Format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types: feat, fix, docs, style, refactor, test, chore
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            starts with an uppercase character.

      - name: Check PR Description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            
            // Check if PR has a description
            if (body.trim().length < 50) {
              core.setFailed('PR description is too short. Please provide a detailed description (minimum 50 characters).');
              return;
            }
            
            // Check if PR has checkboxes
            const hasCheckboxes = body.includes('- [ ]') || body.includes('- [x]');
            if (!hasCheckboxes) {
              core.setFailed('PR must use the PR template with checkboxes.');
              return;
            }
            
            // Check if at least one checkbox is checked
            const hasCheckedBox = body.includes('- [x]');
            if (!hasCheckedBox) {
              core.setFailed('Please check at least one item in the PR checklist.');
              return;
            }
            
            core.info('✅ PR description validation passed');

      - name: Check PR Size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const totalChanges = additions + deletions;
            
            const MAX_CHANGES = 1000;
            
            if (totalChanges > MAX_CHANGES) {
              core.warning(`⚠️ This PR is quite large (${totalChanges} lines changed). Consider splitting it into smaller PRs for easier review.`);
            } else {
              core.info(`✅ PR size is reasonable (${totalChanges} lines changed)`);
            }

      - name: Check for Breaking Changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const title = pr.title || '';
            
            const hasBreakingChange = title.includes('!') || 
                                     body.toLowerCase().includes('breaking change') ||
                                     body.toLowerCase().includes('breaking-change');
            
            if (hasBreakingChange) {
              core.warning('⚠️ This PR contains breaking changes. Make sure to update documentation and changelog.');
              
              // Check if breaking changes are documented
              if (!body.toLowerCase().includes('migration')) {
                core.setFailed('Breaking changes detected but no migration guide provided. Please add migration instructions.');
              }
            }

      - name: Label PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title.toLowerCase();
            const labels = [];
            
            // Auto-label based on PR title
            if (title.startsWith('feat')) labels.push('enhancement');
            if (title.startsWith('fix')) labels.push('bug');
            if (title.startsWith('docs')) labels.push('documentation');
            if (title.startsWith('test')) labels.push('testing');
            if (title.startsWith('chore')) labels.push('maintenance');
            if (title.includes('breaking')) labels.push('breaking-change');
            
            // Add size labels
            const additions = pr.additions;
            const deletions = pr.deletions;
            const totalChanges = additions + deletions;
            
            if (totalChanges < 10) labels.push('size/XS');
            else if (totalChanges < 50) labels.push('size/S');
            else if (totalChanges < 200) labels.push('size/M');
            else if (totalChanges < 500) labels.push('size/L');
            else labels.push('size/XL');
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labels
              });
            }

  lint-and-test:
    name: Run Linting and Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run tests
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  require-approval:
    name: Require Approval
    runs-on: ubuntu-latest
    needs: [validate-pr, lint-and-test]
    
    steps:
      - name: Check Approvals
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Get reviews
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            
            const approvals = reviews.data.filter(review => review.state === 'APPROVED');
            
            if (approvals.length === 0) {
              core.info('⏳ Waiting for at least one approval before merge');
            } else {
              core.info(`✅ PR has ${approvals.length} approval(s)`);
            }
